name: Akıllı Saat Takip Botu

on:
  schedule:
    # Her gün Türkiye saatiyle 00:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub panelinden dilediğiniz an manuel çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Depodan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Saat Takip Botunu Çalıştır
        run: python saat_takip_botu.py
